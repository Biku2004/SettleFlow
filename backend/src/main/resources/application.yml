spring:
  application:
    name: settleflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/settleflow}
    username: ${DB_USERNAME:settleflow}
    password: ${DB_PASSWORD:settleflow_local}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
